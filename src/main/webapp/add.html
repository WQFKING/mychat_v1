<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>新規登録</title>
	<link rel="stylesheet" href="html.css">
	<script src="js/jquery.min.js"></script>
	<script src="js/title.js"></script>
</head>
<body>
	<div class="page">
		<main class="card">
			<div class="card-header">
				<h1 class="card-title">新規登録</h1>
				<p class="card-subtitle">アカウントを作成します</p>
			</div>
			<div class="card-body stack">
				<table id="tb" aria-label="register-form">
					<tr>
						<td class="centerMust" colspan="2">新規登録</td>
					</tr>
					<tr>
						<td class="label">メール</td>
						<td><input type="email" name="email" id="email" autocomplete="email"></td>
					</tr>
					<tr>
						<td class="label">パスワード</td>
						<td><input type="password" name="password" id="password" autocomplete="new-password"></td>
					</tr>
					<tr>
						<td class="label">パスワード（確認）</td>
						<td><input type="password" name="password" id="passwordw" autocomplete="new-password"></td>
					</tr>
					<tr>
						<td colspan="2" class="centerMust">
							<button class="bt" id="submit" type="button">登録</button>
						</td>
					</tr>
				</table>

				<span id="result"></span>
				<div class="dv" aria-hidden="true">+</div>
			</div>
		</main>
	</div>

	<script type="text/javascript">
		$(function () {
			$('#submit').on('click', function () {
				const email = $('#email').val();
				const password = $('#password').val();
				const passwordw = $('#passwordw').val();

				if (password !== passwordw) {
					$('#result').html("<span style='color:#ef4444;font-weight:700;'>パスワードが一致しません。</span>");
					return;
				}

				$.ajax({
					url: '/wechat/Add',
					type: 'POST',
					dataType: 'json',
					data: {
						'email': email,
						'password': password,
						'passwordw': passwordw
					}
				})
					.done((res) => {
						$('#result').html(res.message);
						$('#submit').hide();
						$('input').prop('disabled', true);
					})
					.fail((res) => {
						const data = res.responseJSON || {};
						if (res.status === 422) {
							$('#result').html("入力エラー：" + (data.message || ""));
						} else if (res.status === 500) {
							$('#result').html("システムエラーが発生しました。しばらくしてから再度お試しください。");
							console.error("Database/Server Error Details:", data.debug_info);
						}
					});
			});
		});
	</script>
</body>
</html>
