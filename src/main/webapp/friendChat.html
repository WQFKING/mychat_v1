<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>チャット</title>
	<link rel="stylesheet" href="html.css">
	<script src="js/jquery.min.js"></script>
	<script src="js/title.js"></script>
</head>
<body>
	<div class="page">
		<main class="card card-wide">
			<div class="card-header">
				<h1 class="card-title">チャット</h1>
				<p class="card-subtitle" id="friendNameDisplay">友だち</p>
			</div>

			<div class="card-body stack">
				<div id="chatBox" class="panel scroll-panel chat-box" aria-label="chat-messages"></div>

				<div class="panel" style="display:flex; gap:10px; align-items:center;">
					<input type="text" id="sendBox" placeholder="メッセージを入力...">
					<button id="send" type="button" style="white-space:nowrap;">送信</button>
				</div>
			</div>
		</main>
	</div>

	<script>
		const urlParams = new URLSearchParams(window.location.search);
		const friendEmail = urlParams.get('email');
		$('#friendNameDisplay').text(friendEmail || "友だち");

		function syncChatbox() {
			$.ajax({
				url: '/wechat/FriendChatReceive',
				type: 'POST',
				dataType: 'json',
				data: { 'friendEmail': friendEmail }
			}).done((res) => {
				let html = "";
				res.messages.forEach(msg => {
					if (msg.isMine) {
						html += `<div class="bubble bubble-mine">${escapeHtml(msg.content)}</div>`;
					} else {
						html += `<div class="bubble bubble-other">${escapeHtml(msg.content)}</div>`;
					}
				});

				$('#chatBox').html(html);
				const cb = document.getElementById('chatBox');
				cb.scrollTop = cb.scrollHeight;
			});
		}

		function escapeHtml(text) {
			return (text || "").replace(/[&<"']/g, m => ({ '&': '&amp;', '<': '&lt;', '"': '&quot;', "'": '&#39;' }[m]));
		}

		$(function () {
			syncChatbox();
			setInterval(syncChatbox, 2000);

			$('#send').on('click', function () {
				const content = $('#sendBox').val();
				if (!content.trim()) return;

				$.ajax({
					url: 'FriendChatSend',
					type: 'POST',
					data: {
						'sendChatContent': content,
						'receiverEmail': friendEmail
					}
				}).done(() => {
					$('#sendBox').val('');
					syncChatbox();
				});
			});

			$('#sendBox').keypress(function (e) {
				if (e.which == 13) { $('#send').click(); return false; }
			});
		});
	</script>
</body>
</html>
