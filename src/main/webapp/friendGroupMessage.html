<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>群消息列表</title>
	<link rel="stylesheet" href="html.css">
	<script src="js/jquery.min.js"></script>
	<script src="js/title.js"></script>
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
		rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
		crossorigin="anonymous">
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</head>

<body>
	<div class="page">
		<main class="card card-wide">
			<div class="card-header">
				<h1 class="card-title">群消息列表</h1>
				<p class="card-subtitle">动态和评论</p>
			</div>
			<div class="card-body stack">
				<div id="chatBox" class="panel scroll-panel" aria-label="group-posts"></div>
			</div>
		</main>
	</div>

	<div class="toast-container position-fixed bottom-0 end-0 p-3">
		<div id="liveToast"
			class="toast align-items-center text-white bg-danger border-0"
			role="alert" aria-live="assertive" aria-atomic="true">
			<div class="d-flex">
				<div class="toast-body">评论不能为空。</div>
				<button type="button" class="btn-close btn-close-white me-2 m-auto"
					data-bs-dismiss="toast" aria-label="关闭"></button>
			</div>
		</div>
	</div>

	<script type="text/javascript">
		$(function () {
			syncChatbox()
			function syncChatbox() {
				$.ajax({
					url: '/wechat/FriendGroupMessage',
					type: 'POST',
					dataType: 'json',
					data: {}
				}).done((res) => {
					let chatBox = "";
					res.forEach(element => {
						chatBox += `<div class="panel" style="margin-bottom: 14px;">`;
						chatBox += `<div style="display:flex;justify-content:space-between;gap:12px;align-items:baseline;">`;
						chatBox += `<strong>${element.sender_email}:</strong>`;
						chatBox += `<small style="color:rgba(15,23,42,.55);">${element.created_at}</small>`;
						chatBox += `</div>`;
						chatBox += `<div style="margin-top:8px;margin-bottom:10px;">${element.friend_group_content}</div>`;

						chatBox += `<div class="panel" style="background: rgba(255,255,255,.65); border-radius: 12px; padding: 10px;">`;
						if (element.comments && element.comments.length > 0) {
							element.comments.forEach(comment => {
								chatBox += `<div style="font-size: 0.92em; padding: 6px 0; border-top: 1px solid rgba(2,6,23,.06);">`;
								chatBox += `<b style="color:#4f46e5;">${comment.sender_email}:</b> ${comment.friend_group_message_comment}`;
								chatBox += `</div>`;
							});
						} else {
							chatBox += `<div style="color:rgba(15,23,42,.45); font-size: 0.85em;">暂无评论</div>`;
						}
						chatBox += `</div>`;

						chatBox += `<div style="display:flex; gap:10px; align-items:center; margin-top: 10px;">`;
						chatBox += `<input type="text" id="comment-${element.id}" placeholder="说点什么..." style="flex:1;">`;
						chatBox += `<button class="comment-btn" data-id="${element.id}" type="button" style="white-space:nowrap;">评论</button>`;
						chatBox += `</div>`;
						chatBox += `</div>`;
					});

					$('#chatBox').html(chatBox);

					$('.comment-btn').off('click').on('click', function () {
						const id = $(this).attr('data-id');
						const content = $('#comment-' + id).val();

						if (!content.trim()) {
							const toastLiveExample = document.getElementById('liveToast');
							const toast = new bootstrap.Toast(toastLiveExample);
							toast.show();
							return;
						}

						$.ajax({
							url: '/wechat/FriendGroupMessageCommentAdd',
							type: 'POST',
							dataType: 'json',
							data: {
								friendGroupMessageId: id,
								friendGroupMessageComment: content
							}
						}).done(() => {
							location.reload();
						}).fail((err) => {
							console.error("评论失败", err);
						});
					});

					const $cb = $('#chatBox');
					$cb.scrollTop($cb[0].scrollHeight);
				});
			}
		});
	</script>
</body>
</html>
