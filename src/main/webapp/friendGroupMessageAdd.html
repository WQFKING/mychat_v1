<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>发布群消息</title>
	<link rel="stylesheet" href="html.css">
	<script src="js/jquery.min.js"></script>
	<script src="js/title.js"></script>
	<link
		href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
		rel="stylesheet"
		integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
		crossorigin="anonymous">
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
		crossorigin="anonymous"></script>
</head>

<body>
	<div class="page">
		<main class="card">
			<div class="card-header">
				<h1 class="card-title">发布群消息</h1>
				<p class="card-subtitle">Share something with your group</p>
			</div>
			<div class="card-body stack">
				<div class="row">
					<div class="label">消息内容</div>
					<textarea id="sendBox" placeholder="写点什么..."></textarea>
				</div>

				<div class="row">
					<button id="send" class="bt" type="button">发布</button>
				</div>

				<div id="remind"></div>
			</div>
		</main>
	</div>

	<script type="text/javascript">
		$(function () {
			function showRemind(message, type = 'danger') {
				$('#remind').html(`
					<div class="alert alert-${type} alert-dismissible fade show" role="alert">
						${message}
						<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="关闭"></button>
					</div>
				`);

				setTimeout(() => {
					$('.alert').alert('close');
				}, 3000);
			}

			$('#send').on('click', function () {
				const content = $('#sendBox').val().trim();
				if (!content) {
					showRemind("请输入内容。", "warning");
					return;
				}

				$.ajax({
					url: '/wechat/FriendGroupMessageAdd',
					type: 'POST',
					dataType: 'json',
					data: {
						'friendGroupContent': content,
					}
				})
					.done((res) => {
						if (res.status === "success") {
							showRemind("群消息发布成功。", "success");
							$('#sendBox').val('');
						}
					}).fail(() => {
						showRemind("发布失败，请稍后重试。", "danger");
					});
			});
		})
	</script>
</body>
</html>
