<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>添加好友</title>
	<link rel="stylesheet" href="html.css">
	<script src="js/jquery.min.js"></script>
	<script src="js/title.js"></script>
</head>

<body>
	<div class="page">
		<main class="card">
			<div class="card-header">
				<h1 class="card-title">添加好友</h1>
				<p class="card-subtitle">Search and send a friend request</p>
			</div>

			<div class="card-body stack">
				<table id="tb">
					<tr>
						<td class="centerMust" colspan="2">添加好友</td>
					</tr>
					<tr>
						<td class="label">好友邮箱</td>
						<td><input type="email" id="friendEmail" autocomplete="email"></td>
					</tr>
					<tr>
						<td colspan="2" class="centerMust">
							<button class="bt" id="submit" type="button">搜索</button>
						</td>
					</tr>
				</table>

				<span id="result"></span>
				<div class="dv" aria-hidden="true">+</div>
			</div>
		</main>
	</div>

	<script type="text/javascript">
		$(function () {
			$('#submit').on('click', function () {
				$.ajax({
					url: '/wechat/Friend/Add/Search',
					type: 'POST',
					dataType: 'json',
					data: {
						'friendEmail': $('#friendEmail').val(),
					}
				})
					.done((res) => {
						if (res.message == "success") {
							$('#friendEmail').prop('readonly', true);
							$('#result').html("<button id='addFriend' type='button'>添加好友</button>");
						} else if (res.message == "fail") {
							$('#result').html("未找到该用户");
							$('#friendEmail').prop('readonly', false);
						}
					})
					.fail((res) => {
						const data = res.responseJSON || {};
						if (res.status === 422) {
							$('#result').html("输入错误：" + (data.message || ""));
						} else if (res.status === 500) {
							$('#result').html("系统发生错误，请稍后再试。");
							console.error("Database/Server Error Details:", data.debug_info);
						} else if (res.status == 401) {
							$('#result').html("认证失败：" + (data.message || ""));
						}
					});
			});
		});

		$(document).on('click', '#addFriend', function () {
			$.ajax({
				url: '/wechat/Friend/Add',
				type: 'POST',
				dataType: 'json',
				data: {
					'friendEmail': $('#friendEmail').val()
				}
			})
				.done((res) => {
					if (res.status == "success") {
						$('#result').html("好友申请已发送");
					} else {
						$('#result').html(res.message);
					}
				});
		});
	</script>
</body>
</html>
