<!doctype html>
<html lang="zh-CN">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>教师示例 - 好友搜索</title>
	<script src="../js/jquery.min.js"></script>
	<script src="../js/title.js"></script>
	<link rel="stylesheet" href="../html.css">
</head>
<body>
	<div class="page">
		<main class="card">
			<div class="card-header">
				<h1 class="card-title">教师示例 - 好友搜索</h1>
				<p class="card-subtitle">Teacher demo page</p>
			</div>
			<div class="card-body stack">
				<div class="row">
					<div class="label">好友邮箱</div>
					<input id="friendEmail" type="email" autocomplete="email">
				</div>
				<div class="row">
					<button class="bt" id="submit" type="button">搜索</button>
				</div>
				<div id="result"></div>
			</div>
		</main>
	</div>
</body>
</html>
